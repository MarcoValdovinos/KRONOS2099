<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARKHE-ZERO • Verificar</title>
<style>body{background:#050810;color:#e8f6ff;font-family:system-ui;padding:18px;max-width:720px;margin:auto}
h1{color:#00f0ff;margin:0} .bar{height:14px;display:flex;border-radius:99px;overflow:hidden;margin:12px 0}
.h{width:51%;background:#00f0ff;color:#000;font-weight:800;text-align:center;font-size:12px;line-height:14px}
.ai{width:49%;background:#a855f7;color:#fff;font-weight:800;text-align:center;font-size:12px;line-height:14px}
.card{background:#0b1226;border:1px solid #1e2a4a;border-radius:16px;padding:16px;margin-top:14px}
input,button{width:100%;padding:12px;border-radius:12px;border:1px solid #223;margin-top:10px}
button{background:#00f0ff;color:#000;font-weight:800;border:0} button.gold{background:#ffd700}
pre{white-space:pre-wrap;word-break:break-all;background:#000;padding:12px;border-radius:12px}
small{color:#9ab}</style></head><body>
<h1>ARKHE-ZERO</h1><p>KRONOS2099 • Verificación de legado • Toluca-Global</p>
<div class="bar"><div class="h">51% HUMANO</div><div class="ai">49% IA</div></div>
<div class="card"><b>1. Elige tu archivo</b><input type="file" id="f"><button onclick="verificar()">VERIFICAR AHORA</button><small>Todo se calcula en tu celular, tu archivo no se sube a ningún servidor.</small></div>
<div class="card" id="out" style="display:none"><b>FOLIO</b><h2 id="folio" style="color:#ffd700"></h2><b>SHA-256</b><pre id="hash"></pre><p id="meta"></p><img id="qr" style="background:#fff;padding:8px;border-radius:12px"><br><br>
<button class="gold" onclick="descargarCertificado()">DESCARGAR CERTIFICADO BONITO • SELLO CROMÁTICO</button>
<button onclick="descargarJson()">DESCARGAR JSON PARA MÁQUINAS</button></div>
<script>let D={};
async function verificar(){const f=document.getElementById('f').files[0];if(!f)return alert('Elige un archivo primero');
const buf=await f.arrayBuffer();const h=await crypto.subtle.digest('SHA-256',buf);
const hex=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
const fecha=new Date().toISOString().slice(0,10).replaceAll('-','');
const folio='KRONOS-'+fecha+'-'+hex.slice(0,8).toUpperCase();
D={folio,sha256:hex,archivo:f.name,tamano:f.size,fecha:new Date().toISOString(),autor:'Valdovinos',modelo:'51% Humano / 49% IA'};
document.getElementById('out').style.display='block';
document.getElementById('folio').innerText=folio;
document.getElementById('hash').innerText=hex;
document.getElementById('meta').innerText='Archivo: '+f.name+' • Tamaño: '+f.size+' bytes • Verificado: '+D.fecha;
document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(folio+'|'+hex);}
function descargarJson(){const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=D.folio+'.json';a.click();}
function descargarCertificado(){
const cert=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${D.folio}</title><style>body{background:#0a0a12;font-family:system-ui;display:flex;justify-content:center;padding:20px}.cert{background:#fdf6e3;color:#111;width:100%;max-width:700px;border:4px solid #d4af37;border-radius:18px;padding:28px}h1{text-align:center}h2{color:#b8860b;text-align:center;border-top:2px solid #d4af37;border-bottom:2px solid #d4af37;padding:10px}table{width:100%}td{padding:8px;border-bottom:1px solid #e8d9a0;word-break:break-all}.sello-wrap{display:flex;justify-content:center;gap:20px;align-items:center}.sello{width:150px;height:150px;border-radius:50%;background:conic-gradient(from 0deg,#00f0ff,#a855f7,#ffd700,#ff4d6d,#00f0ff);display:flex;align-items:center;justify-content:center;animation:girar 8s linear infinite;padding:6px}@keyframes girar{to{transform:rotate(360deg)}}.sello-in{width:118px;height:118px;border-radius:50%;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11px;border:2px dashed gold}.qr{background:#fff;padding:8px;border-radius:12px}</style></head><body><div class="cert"><p style="text-align:center"><small>KRONOS2099 • ARKHE-ZERO • TOLUCA-GLOBAL</small></p><h1>CERTIFICADO DE VERIFICACIÓN</h1><h2>${D.folio}</h2><table><tr><td>Archivo</td><td>${D.archivo}</td></tr><tr><td>SHA-256</td><td>${D.sha256}</td></tr><tr><td>Tamaño</td><td>${D.tamano} bytes</td></tr><tr><td>Fecha</td><td>${D.fecha}</td></tr><tr><td>Autor</td><td>Valdovinos</td></tr><tr><td>Modelo</td><td>51% Humano / 49% IA</td></tr></table><div class="sello-wrap"><div class="sello"><div class="sello-in"><b>ARKHE-ZERO</b>VERIFICADO<br>51 / 49<br>SELLO CROMÁTICO</div></div><img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(D.folio+'|'+D.sha256)}"></div><p style="text-align:center"><b>Valdovinos</b><br>Autor Humano • Dueño de la visión<br><small>Si el archivo cambia una letra, el hash cambia y el folio ya no coincide. Hasta 2099.</small></p></div></body></html>`;
const b=new Blob([cert],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=D.folio+'-CERTIFICADO.html';a.click();}
</script></body></html>
